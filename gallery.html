<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NATBIOS Stock Archive | Photography & Video</title>
    <meta name="description" content="License world-class photography and 4K video from independent creators." />

    <!-- =====================================================================
         FONTS
         Inter for UI chrome (labels, buttons, metadata).
         Playfair Display for hero text — gives the site a premium editorial feel.
    ====================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />

    <!-- =====================================================================
         SUPABASE JS — loaded from the official CDN.
         We use the ESM (module) build so we can do clean named imports in app.js
         without any build step or bundler.
         Pin to a specific minor version so a CDN update never breaks production.
    ====================================================================== -->
    <!-- No <script> tag needed here — we import it as an ES module in app.js -->

    <style>
        /* ==================================================================
           CSS CUSTOM PROPERTIES (Design Tokens)
           Change these 8 lines to retheme the entire site.
        ================================================================== */
        :root {
            --c-bg: #0f0f0f;
            /* Near-black canvas */
            --c-surface: #1a1a1a;
            /* Card / modal background */
            --c-surface-2: #242424;
            /* Hover state for cards */
            --c-border: #2e2e2e;
            /* Subtle dividers */
            --c-accent: #3d8350;
            /* Warm gold — the signature colour */
            --c-accent-dark: #4ba05b;
            /* Pressed / hover state for accent */
            --c-text: #f0ede6;
            /* Primary text — warm white */
            --c-text-muted: #888880;
            /* Secondary / metadata text */

            --font-display: 'Playfair Display', Georgia, serif;
            --font-ui: 'Inter', system-ui, sans-serif;

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;

            --shadow-card: 0 2px 8px rgba(0, 0, 0, .45);
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, .7);

            --transition: 150ms ease;
            --grid-gap: 12px;
        }

        /* ==================================================================
           RESET & BASE
        ================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--c-bg);
            color: var(--c-text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img,
        video {
            display: block;
            max-width: 100%;
        }

        button {
            font-family: var(--font-ui);
            cursor: pointer;
            border: none;
            outline: none;
        }

        input,
        select,
        textarea {
            font-family: var(--font-ui);
            outline: none;
        }

        /* ==================================================================
           UTILITY CLASSES
        ================================================================== */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: background var(--transition), transform var(--transition);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--c-accent);
            color: #0f0f0f;
        }

        .btn-primary:hover {
            background: var(--c-accent-dark);
        }

        .btn-ghost {
            background: transparent;
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
        }

        .btn-ghost:hover {
            color: var(--c-text);
            border-color: var(--c-text-muted);
        }

        /* ==================================================================
           NAVIGATION
        ================================================================== */
        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 60px;
            background: rgba(15, 15, 15, .88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--c-border);
        }

        .nav__logo {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--c-accent);
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav__logo span {
            color: var(--c-text);
        }

        .nav__links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Auth state: these containers are toggled by JS */
        #nav-auth-signed-out,
        #nav-auth-signed-in {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #nav-user-email {
            font-size: 0.8rem;
            color: var(--c-text-muted);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ==================================================================
           HERO / SEARCH BAR
        ================================================================== */
        .hero {
            padding: 64px 24px 48px;
            text-align: center;
        }

        .hero__eyebrow {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--c-accent);
            margin-bottom: 12px;
        }

        .hero__title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
            color: var(--c-text);
            margin-bottom: 24px;
        }

        .hero__title em {
            font-style: normal;
            color: var(--c-accent);
        }

        /* Search form */
        .search-form {
            display: flex;
            max-width: 620px;
            margin: 0 auto;
            gap: 0;
            border: 1px solid var(--c-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--c-surface);
            transition: border-color var(--transition);
        }

        .search-form:focus-within {
            border-color: var(--c-accent);
        }

        #search-input {
            flex: 1;
            padding: 14px 18px;
            background: transparent;
            border: none;
            color: var(--c-text);
            font-size: 0.95rem;
        }

        #search-input::placeholder {
            color: var(--c-text-muted);
        }

        #search-btn {
            padding: 0 22px;
            background: var(--c-accent);
            color: #0f0f0f;
            font-size: 0.875rem;
            font-weight: 600;
        }

        #search-btn:hover {
            background: var(--c-accent-dark);
        }

        /* ==================================================================
           TAG FILTER BAR
        ================================================================== */
        .tag-bar {
            display: flex;
            gap: 8px;
            padding: 0 24px 32px;
            overflow-x: auto;
            /* Hide scrollbar visually but keep it functional */
            scrollbar-width: none;
        }

        .tag-bar::-webkit-scrollbar {
            display: none;
        }

        .tag-pill {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
            background: var(--c-surface);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
            cursor: pointer;
            transition: background var(--transition), color var(--transition),
                border-color var(--transition);
            white-space: nowrap;
        }

        .tag-pill:hover,
        .tag-pill.is-active {
            background: var(--c-accent);
            color: #0f0f0f;
            border-color: var(--c-accent);
        }

        /* ==================================================================
           MASONRY GRID
           CSS column-count masonry — no JS library needed.
           The card absolute-position trick in JS fills columns top-to-bottom
           which is exactly how Shutterstock's grid works.
        ================================================================== */
        .grid-container {
            padding: 0 24px 48px;
        }

        /* Status messages shown before / during / after grid load */
        .grid-status {
            text-align: center;
            padding: 64px 24px;
            color: var(--c-text-muted);
            font-size: 0.95rem;
        }

        /* The masonry grid itself */
        #masonry-grid {
            columns: 4 280px;
            /* Auto-fit columns of minimum 280px */
            gap: var(--grid-gap);
        }

        /* ==================================================================
           ASSET CARD
        ================================================================== */
        .asset-card {
            break-inside: avoid;
            /* Keeps card in one column */
            margin-bottom: var(--grid-gap);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--c-surface);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            position: relative;
            /* Hardware-accelerated hover lift */
            transition: transform 200ms ease, box-shadow 200ms ease;
        }

        .asset-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
        }

        .asset-card__thumb {
            width: 100%;
            height: auto;
            /* Skeleton shimmer while image loads */
            background: linear-gradient(90deg, var(--c-surface) 25%, var(--c-surface-2) 50%, var(--c-surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            display: block;
        }

        .asset-card__thumb.loaded {
            animation: none;
            background: none;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Overlay shown on hover */
        .asset-card__overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, .75) 0%, transparent 55%);
            opacity: 0;
            transition: opacity 200ms ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 14px;
        }

        .asset-card:hover .asset-card__overlay {
            opacity: 1;
        }

        .asset-card__title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 4px;
            /* Truncate to 2 lines */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .asset-card__meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .asset-card__photographer {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, .7);
        }

        .asset-card__price {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--c-accent);
        }

        /* Video badge — shown on video asset cards */
        .asset-card__badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 3px 7px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        /* ==================================================================
           MODAL — Image Detail View
        ================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
        }

        .modal-backdrop.is-open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--c-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-modal);
            width: 100%;
            max-width: 960px;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 340px;
        }

        @media (max-width: 680px) {
            .modal {
                grid-template-columns: 1fr;
            }
        }

        .modal__preview {
            position: relative;
            background: #000;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            overflow: hidden;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #modal-preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Watermark overlay — CSS-only, no canvas needed for this preview */
        .modal__watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            /* Diagonal repeating watermark text */
            background-image: repeating-linear-gradient(-45deg,
                    transparent,
                    transparent 60px,
                    rgba(255, 255, 255, .03) 60px,
                    rgba(255, 255, 255, .03) 61px);
        }

        .modal__watermark-text {
            font-family: var(--font-display);
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: 700;
            color: rgba(255, 255, 255, .18);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transform: rotate(-30deg);
            user-select: none;
            white-space: nowrap;
        }

        .modal__info {
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .modal__close {
            align-self: flex-end;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .modal__close:hover {
            color: var(--c-text);
        }

        #modal-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            line-height: 1.25;
            color: var(--c-text);
        }

        .modal__photographer {
            font-size: 0.82rem;
            color: var(--c-text-muted);
        }

        .modal__photographer strong {
            color: var(--c-accent);
        }

        .modal__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal__tag {
            font-size: 0.72rem;
            padding: 4px 10px;
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: 999px;
            color: var(--c-text-muted);
            cursor: pointer;
        }

        .modal__tag:hover {
            color: var(--c-text);
            border-color: var(--c-text-muted);
        }

        /* Spec table — camera, dimensions, file size */
        .modal__specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            font-size: 0.8rem;
        }

        .modal__spec-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal__spec-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--c-text-muted);
        }

        .modal__spec-value {
            color: var(--c-text);
            font-weight: 500;
        }

        .modal__divider {
            border: none;
            border-top: 1px solid var(--c-border);
        }

        /* Price and buy section */
        .modal__price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        #modal-price {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--c-accent);
        }

        .modal__license-label {
            font-size: 0.78rem;
            color: var(--c-text-muted);
        }

        #modal-buy-btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            text-align: center;
            justify-content: center;
        }

        /* ==================================================================
           AUTH MODAL
        ================================================================== */
        .auth-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, .85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
        }

        .auth-modal-backdrop.is-open {
            opacity: 1;
            pointer-events: all;
        }

        .auth-modal {
            background: var(--c-surface);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-modal);
        }

        .auth-modal__title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .auth-modal__subtitle {
            font-size: 0.85rem;
            color: var(--c-text-muted);
            margin-bottom: 28px;
        }

        .auth-modal__subtitle a {
            color: var(--c-accent);
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--c-text-muted);
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            color: var(--c-text);
            font-size: 0.9rem;
            transition: border-color var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--c-accent);
        }

        .form-group select option {
            background: var(--c-surface);
        }

        .auth-modal__submit {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            justify-content: center;
        }

        .auth-error {
            font-size: 0.82rem;
            color: #e07070;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        /* ==================================================================
           TOAST NOTIFICATIONS
        ================================================================== */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            color: var(--c-text);
            box-shadow: var(--shadow-card);
            animation: toast-in 250ms ease forwards;
            max-width: 320px;
        }

        .toast.success {
            border-color: #5a9e6f;
        }

        .toast.error {
            border-color: #9e5a5a;
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================================================================
           LOAD MORE BUTTON
        ================================================================== */
        .load-more-wrap {
            text-align: center;
            padding: 8px 24px 64px;
        }

        #load-more-btn {
            padding: 12px 40px;
        }

        /* ==================================================================
           FOOTER
        ================================================================== */
        .footer {
            border-top: 1px solid var(--c-border);
            padding: 32px 24px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--c-text-muted);
        }

        /* ==================================================================
           RESPONSIVE TWEAKS
        ================================================================== */
        @media (max-width: 900px) {
            #masonry-grid {
                columns: 3 220px;
            }
        }

        @media (max-width: 600px) {
            .hero {
                padding: 40px 16px 32px;
            }

            .grid-container {
                padding: 0 12px 32px;
            }

            #masonry-grid {
                columns: 2 150px;
                gap: 8px;
            }

            .tag-bar {
                padding: 0 12px 24px;
            }

            .modal {
                grid-template-columns: 1fr;
            }

            .modal__preview {
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            }
        }

        /* Respect user's motion preference */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Landing-page visual system */
        :root { --c-bg:#fff; --c-surface:#fff; --c-surface-2:#f5f5f5; --c-border:#e5e5e5; --c-accent:#a4ea64; --c-accent-dark:#8ed84e; --c-text:#141414; --c-text-muted:#666; --radius-sm:0px; --radius-md:0px; --radius-lg:0px; --shadow-card:none; --shadow-modal:0 24px 64px rgba(0,0,0,.3); --grid-gap:20px; }
        body { color:var(--c-text); }
        .nav { height:80px; padding:0 max(24px, calc((100vw - 1400px) / 2 + 32px)); background:rgba(255,255,255,.96); border-bottom-color:var(--c-border); backdrop-filter:blur(12px); }
        .nav__logo { font-family:var(--font-ui); color:var(--c-text); font-size:1.45rem; font-weight:800; letter-spacing:-.05em; text-transform:uppercase; gap:0; border-left:4px solid #141414; padding-left:8px; }
        .nav__logo span { color:var(--c-text); } .nav__logo .logo-accent { color:var(--c-accent); }
        .nav__section-label { margin-left:18px; padding-left:18px; border-left:1px solid var(--c-border); color:var(--c-text-muted); font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
        .nav__links { gap:10px; } .nav__back-link { color:var(--c-text-muted); font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-right:14px; } .nav__back-link:hover { color:var(--c-text); text-decoration:underline; }
        .btn { border-radius:0; text-transform:uppercase; font-size:.7rem; letter-spacing:.1em; padding:11px 16px; } .btn-primary { background:var(--c-accent); color:#141414; } .btn-primary:hover { background:#141414; color:#fff; } .btn-ghost { color:var(--c-text); border-color:var(--c-border); } .btn-ghost:hover { border-color:#141414; color:#141414; }
        .hero { max-width:1400px; margin:0 auto; padding:82px 32px 45px; text-align:left; border-bottom:1px solid var(--c-border); } .hero__eyebrow { color:var(--c-text-muted); font-size:.68rem; font-weight:700; letter-spacing:.22em; margin-bottom:18px; } .hero__title { font-size:clamp(2.7rem,5.5vw,5rem); max-width:760px; color:#141414; margin-bottom:30px; } .hero__title em { color:#141414; font-style:italic; }
        .search-form { max-width:720px; margin:0; border-radius:0; background:#fff; } #search-input { color:#141414; } #search-btn { background:#141414; color:#fff; text-transform:uppercase; font-weight:700; letter-spacing:.1em; font-size:.7rem; } #search-btn:hover { background:var(--c-accent); color:#141414; }
        .tag-bar,.grid-container { max-width:1400px; margin-left:auto; margin-right:auto; } .tag-bar { padding:28px 32px 34px; } .tag-pill { border-radius:0; background:#fff; color:var(--c-text-muted); font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .tag-pill:hover,.tag-pill.is-active { background:#141414; color:#fff; border-color:#141414; }
        .grid-container { padding:0 32px 70px; } .grid-status { color:var(--c-text-muted); } .asset-card { border-radius:0; background:#f5f5f5; box-shadow:none; } .asset-card:hover { transform:none; box-shadow:none; } .asset-card__overlay { padding:16px; } .asset-card__price { color:var(--c-accent); } .asset-card__badge { border-radius:0; font-size:.62rem; }
        .load-more-wrap { padding-bottom:70px; } .footer { color:var(--c-text-muted); background:#141414; border:none; padding:34px 24px; } .modal,.auth-modal { background:#fff; } .modal__info,#modal-title,.modal__spec-value,.auth-modal__title { color:#141414; } .modal__close,.form-group input,.form-group select { background:#fff; color:#141414; } .modal__tag { border-radius:0; background:#f5f5f5; }
        @media (max-width:700px) { .nav { height:64px; padding:0 16px; } .nav__section-label,.nav__back-link { display:none; } .hero { padding:56px 16px 32px; } .tag-bar { padding:22px 16px 28px; } .grid-container { padding:0 16px 48px; } .nav__links { gap:6px; } .nav__links .btn { padding:9px 10px; font-size:.62rem; } }
    </style>
</head>

<body>

    <!-- ====================================================================
         NAVIGATION
    ===================================================================== -->
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <a href="index.html" class="nav__logo" aria-label="Go to NATBIOS home">
            <span>N<span class="logo-accent">A</span>TBIOS</span>
        </a>
        <span class="nav__section-label">Stock Archive</span>

        <div class="nav__links">
            <a href="index.html" class="nav__back-link">Back to home</a>
            <!-- Shown when the user is NOT logged in -->
            <div id="nav-auth-signed-out">
                <button class="btn btn-ghost" id="btn-open-login">Log in</button>
                <button class="btn btn-primary" id="btn-open-signup">Sign up</button>
            </div>

            <!-- Shown when the user IS logged in (hidden by default) -->
            <div id="nav-auth-signed-in" style="display:none">
                <span id="nav-user-email"></span>
                <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
                <button class="btn btn-ghost" id="btn-logout">Log out</button>
            </div>
        </div>
    </nav>

    <!-- ====================================================================
         HERO + SEARCH
    ===================================================================== -->
    <header class="hero" role="banner">
        <p class="hero__eyebrow">NATBIOS Productions / Stock Archive</p>
        <h1 class="hero__title">
            India, in its<br />
            <em>wildest detail.</em>
        </h1>

        <form class="search-form" id="search-form" role="search">
            <label for="search-input" class="visually-hidden">Search photos and videos</label>
            <input id="search-input" type="search" placeholder="Search wildlife, landscapes, aerials, 4K video..."
                autocomplete="off" spellcheck="false" />
            <button type="submit" id="search-btn" aria-label="Run search">Search</button>
        </form>
    </header>

    <!-- ====================================================================
         TAG FILTER BAR
         Populated dynamically from the `tags` table in app.js
    ===================================================================== -->
    <div class="tag-bar" id="tag-bar" role="list" aria-label="Filter by category">
        <!-- JS fills these in -->
    </div>

    <!-- ====================================================================
         MASONRY GRID
    ===================================================================== -->
    <main class="grid-container" id="grid-container">
        <!-- Loading skeleton shown while the first fetch runs -->
        <p class="grid-status" id="grid-status" aria-live="polite">
            Loading assets…
        </p>
        <div id="masonry-grid" aria-label="Photo and video grid"></div>
    </main>

    <!-- Load More button (hidden until first page loads) -->
    <div class="load-more-wrap" id="load-more-wrap" style="display:none">
        <button class="btn btn-ghost" id="load-more-btn">Load more</button>
    </div>

    <!-- ====================================================================
         IMAGE / VIDEO DETAIL MODAL
    ===================================================================== -->
    <div class="modal-backdrop" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <!-- Left: watermarked preview -->
            <div class="modal__preview">
                <img id="modal-preview-img" src="" alt="" loading="lazy" />
                <div class="modal__watermark">
                    <span class="modal__watermark-text">Natbios Stock Preview</span>
                </div>
            </div>

            <!-- Right: metadata + buy panel -->
            <aside class="modal__info">
                <button class="modal__close" id="modal-close-btn" aria-label="Close detail view">✕ Close</button>

                <h2 id="modal-title"></h2>
                <p class="modal__photographer">by <strong id="modal-photographer"></strong></p>

                <div class="modal__tags" id="modal-tags"></div>

                <hr class="modal__divider" />

                <!-- Technical specs grid -->
                <div class="modal__specs" id="modal-specs"></div>

                <hr class="modal__divider" />

                <!-- Price and buy -->
                <div class="modal__price-row">
                    <span id="modal-price"></span>
                    <span class="modal__license-label" id="modal-license"></span>
                </div>

                <button class="btn btn-primary" id="modal-buy-btn">
                    Buy &amp; Download
                </button>
            </aside>
        </div>
    </div>

    <!-- ====================================================================
         AUTH MODAL (Login / Sign Up)
    ===================================================================== -->
    <div class="auth-modal-backdrop" id="auth-modal" role="dialog" aria-modal="true" aria-label="Authentication">
        <div class="auth-modal">
            <!-- Title changes between "Log in" and "Create account" -->
            <h2 class="auth-modal__title" id="auth-modal-title">Log in</h2>
            <p class="auth-modal__subtitle" id="auth-modal-subtitle">
                New here?
                <a id="auth-toggle-link">Create an account</a>
            </p>

            <!-- Fields that only show during sign-up -->
            <div id="signup-fields" style="display:none">
                <div class="form-group">
                    <label for="auth-display-name">Display name</label>
                    <input id="auth-display-name" type="text" placeholder="Jane Photographer" autocomplete="name" />
                </div>
                <div class="form-group">
                    <label for="auth-role">I am a…</label>
                    <select id="auth-role">
                        <option value="customer">Customer (I buy &amp; download)</option>
                        <option value="photographer">Photographer (I upload &amp; sell)</option>
                    </select>
                </div>
            </div>

            <!-- Always-visible fields -->
            <div class="form-group">
                <label for="auth-email">Email</label>
                <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="auth-password">Password</label>
                <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button class="btn btn-primary auth-modal__submit" id="auth-submit-btn">Log in</button>
            <button class="btn btn-ghost auth-modal__submit" id="auth-cancel-btn" style="margin-top:8px">Cancel</button>

            <p class="auth-error" id="auth-error" aria-live="polite"></p>
        </div>
    </div>

    <!-- ====================================================================
         TOAST CONTAINER — app.js appends .toast elements here
    ===================================================================== -->
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- ====================================================================
         FOOTER
    ===================================================================== -->
    <footer class="footer">
        <p>© <span id="footer-year"></span> Natbios Stock. All rights reserved.</p>
    </footer>

    <!-- ====================================================================
         APP ENTRY POINT
         type="module" is required to use ES module import syntax inside app.js
         (which is how we import Supabase from the CDN).
    ===================================================================== -->
    <script type="module" src="app.js"></script>

    <!-- Set footer year without app.js dependency -->
    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>

</body>

</html>
